<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEO 운영 콘솔 — AI 답변 노출 측정·공식 글·외부 출처 관리</title>
<meta name="description" content="AI 답변에 우리 매장이 나오는지 매달 측정하고, 인용 출처 집계·확인된 정보 기반 공식 글 제작·외부 출처 점검·월간 리포트를 관리하는 마케팅팀 내부 도구">
<meta name="theme-color" content="#5146e0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235146e0'/%3E%3Cstop offset='1' stop-color='%23c04ad8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='30' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5fa;--surface:#fff;--surface-2:#f8f9fd;--line:#e4e7f0;--line-2:#eef0f6;
  --text:#1a1d2b;--muted:#5f6680;--faint:#8a90a6;
  --pri:#5146e0;--pri-2:#7c4dea;--pri-soft:#eeedfd;
  --grad:linear-gradient(135deg,#5146e0 0%,#7c4dea 55%,#c04ad8 100%);
  --ok:#0f7a55;--ok-bg:#e2f5ec;--warn:#a85100;--warn-bg:#fff1df;--err:#c42b3b;--err-bg:#fde8ea;--info:#2458d6;--info-bg:#e7eefe;
  --r:16px;--r-sm:10px;
  --sh:0 1px 2px rgba(20,22,40,.04),0 6px 20px -8px rgba(30,32,70,.12);
  --sh-lg:0 24px 60px -20px rgba(30,30,80,.35);
  --side:248px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
a{color:var(--pri)}
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#fff,#fbfbff);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 8px 20px -8px #5146e0aa;flex:none}
.logo.sm{width:32px;height:32px;border-radius:10px;font-size:15px}
.brand-name{font-weight:800;letter-spacing:-.02em}
.brand-sub{font-size:13px;color:var(--muted)}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;transition:background .15s,color .15s}
.side-nav a:hover{background:var(--surface-2);color:var(--text)}
.side-nav a.on{background:var(--pri-soft);color:var(--pri)}
.side-nav a .badge{margin-left:auto}
.side-foot{margin-top:auto;padding:0 6px}
.topbar{display:none}
.main{max-width:1240px;margin:0 auto;padding:28px 32px 64px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.bottom{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}
  .top-title{font-weight:800;flex:1;min-width:0}
  .main{padding:18px 14px 110px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;color:var(--faint);text-decoration:none;font-size:12px;font-weight:700;background:none;border:0;font-family:inherit;cursor:pointer;border-radius:12px}
  .bottom .on{color:var(--pri)}
}
/* typography & layout */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:20px}
.page-head .titles{flex:1 1 280px;min-width:0}
h1{font-size:28px;line-height:1.25;letter-spacing:-.03em;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
h2{font-size:19px;letter-spacing:-.02em;margin:0 0 12px;line-height:1.35}
h3{font-size:16px;margin:0 0 8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.card-head h2{margin:0;flex:1 1 auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid2>.card{margin-bottom:0}
.stack-gap>*+*{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px;margin-bottom:16px}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);color:inherit;text-decoration:none;display:block;transition:transform .15s,box-shadow .2s}
a.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.kpi .label{color:var(--muted);font-weight:650;font-size:14px}
.kpi .val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.2;margin:6px 0 6px}
.kpi .val small{font-size:16px;color:var(--muted);font-weight:650}
.kpi::after{content:"";position:absolute;right:-40px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:var(--grad);opacity:.07}
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::after{content:"";position:absolute;right:60px;bottom:-120px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero>*{position:relative;z-index:1}
.hero .sub,.hero .muted{color:rgba(255,255,255,.85)}
.muted{color:var(--muted)}
.small{font-size:14px}
.nowrap{white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
.pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-height:340px;overflow:auto;font-size:15px;margin:0}
mark{background:#ffe27a;border-radius:4px;padding:0 2px;color:inherit}
hr{border:0;border-top:1px solid var(--line-2);margin:16px 0}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:40px;line-height:1;margin-bottom:8px;opacity:.8}
.spacer{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-weight:650;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .15s,background .15s,border-color .15s,filter .15s;white-space:nowrap;line-height:1.2}
.btn:hover{border-color:#cfd3e2;box-shadow:0 4px 12px -6px rgba(30,30,80,.25)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px -10px #5146e0}
.btn.primary:hover{filter:brightness(1.06)}
.btn.soft{background:var(--pri-soft);border-color:transparent;color:var(--pri)}
.btn.danger{color:var(--err);border-color:#f3c7cc}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.icon{width:44px;padding:0;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none;filter:grayscale(.3)}
.btn.block{width:100%}
.hero .btn{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff}
.hero .btn.white{background:#fff;color:var(--pri)}
/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:700;line-height:1.6;white-space:nowrap;background:#eef0f5;color:var(--muted)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.pri{background:var(--pri-soft);color:var(--pri)}
.badge.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field>label{font-weight:650;font-size:15px}
input[type=text],input[type=date],input[type=number],input[type=url],input[type=search],input:not([type]),select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:16px;color:var(--text);background:#fff;transition:border-color .15s,box-shadow .15s;min-width:0}
textarea{resize:vertical;line-height:1.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px #5146e01f}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:550}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri);flex:none;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:0 18px}
.hint{color:var(--muted);font-size:14px}
.req{color:var(--err)}
.err-msg{color:var(--err);font-weight:650;margin:0}
.frow{display:flex;flex-wrap:wrap;gap:0 12px;align-items:flex-end}
.frow>.field{flex:1 1 180px}
.frow>.btn{margin-bottom:14px}
/* chips & tags */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text)}
.chip:hover{border-color:#c9c4f7}
.chip.on{background:var(--pri-soft);border-color:#c9c4f7;color:var(--pri)}
.chip.on::before{content:"✓";font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tag{display:inline-flex;align-items:center;gap:2px;padding:3px 4px 3px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:550;max-width:100%}
.tag button{border:0;background:none;min-width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--muted);font:inherit}
.tag button:hover{background:#e9ebf3;color:var(--text)}
.pill{display:inline-block;padding:1px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;margin:2px 4px 2px 0}
/* tables */
.table-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:16px}
.t th{text-align:left;font-size:14px;color:var(--muted);font-weight:700;padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t th:first-child{border-top-left-radius:10px}.t th:last-child{border-top-right-radius:10px}
.t td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.t tbody tr:hover td{background:#fafbff}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t td select{min-width:110px}
@media (max-width:760px){
  .t.stack thead{display:none}
  .t.stack,.t.stack tbody,.t.stack tr,.t.stack td{display:block;width:100%}
  .t.stack tr{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;padding:6px 14px;background:#fff;box-shadow:var(--sh)}
  .t.stack tbody tr:hover td{background:none}
  .t.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px dashed var(--line-2);padding:8px 0;text-align:right}
  .t.stack td:last-child{border-bottom:0}
  .t.stack td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:14px;text-align:left;flex:none;max-width:42%}
  .t.stack td>*:not(:first-child){margin-left:0}
  .t.stack td.mc{display:block;text-align:left}
  .t.stack td.mc::before{display:none}
  .t.stack td.num{white-space:normal}
  .t.stack td .cell,.t.stack td .scell{width:58%;min-width:0}
  .t.stack td select{width:58%;min-width:0}
  .table-wrap{overflow:visible}
}
/* progress */
.bar{height:10px;border-radius:999px;background:#eceef6;overflow:hidden;min-width:60px}
.bar>span{display:block;height:100%;background:var(--grad);border-radius:inherit;transition:width .5s ease}
.bar.ok>span{background:linear-gradient(90deg,#14a06f,#3cc68f)}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar>span{background:#fff}
.meter{display:flex;align-items:center;gap:10px}
.meter .bar{flex:1}
.meter b{min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
/* notices */
.notice{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:14px 16px;border-radius:14px;border:1px solid;margin-bottom:16px}
.notice .grow{flex:1 1 240px}
.notice.info{background:var(--info-bg);border-color:#cfdcfb;color:#1d3f99}
.notice.warn{background:var(--warn-bg);border-color:#fbd9ad;color:#7a3b00}
.notice.err{background:var(--err-bg);border-color:#f6c5cb;color:#8f1d2b}
.notice.ok{background:var(--ok-bg);border-color:#bfe6d3;color:#0b5c40}
.notice ul{margin:6px 0 0;padding-left:20px}
/* modal & toast */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(18,20,40,.42);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;box-shadow:var(--sh-lg);width:min(580px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .2s cubic-bezier(.2,.9,.3,1.15)}
.modal.wide{width:min(920px,100%)}
.modal-head{display:flex;align-items:center;gap:8px;padding:16px 16px 8px 20px}
.modal-head h2{flex:1;margin:0}
.modal-body{padding:8px 20px 16px;overflow:auto}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line-2)}
@media (max-width:600px){.modal-back{padding:0;align-items:flex-end}.modal,.modal.wide{border-radius:20px 20px 0 0;max-height:94vh;width:100%}.modal-foot .btn{flex:1 1 auto}}
#toast-root{position:fixed;z-index:200;left:50%;transform:translateX(-50%);bottom:24px;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(560px,calc(100% - 24px));pointer-events:none}
.toast{background:#1d2033;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--sh-lg);font-weight:600;animation:pop .2s;pointer-events:auto;transition:all .3s}
.toast.err{background:var(--err)}.toast.warn{background:#9a4b00}
.toast.out{opacity:0;transform:translateY(8px)}
@media (max-width:900px){#toast-root{bottom:92px}}
/* round grid cells */
.cell,.scell{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;width:100%;min-width:128px;min-height:58px;padding:8px 10px;border-radius:12px;border:1.5px dashed #d3d7e4;background:#fff;font:inherit;cursor:pointer;text-align:left;transition:all .15s;color:var(--text)}
.cell:hover,.scell:hover{border-color:var(--pri);transform:translateY(-1px);box-shadow:var(--sh)}
.cell.got{border-style:solid;border-color:#d9dcf0;background:var(--surface-2)}
.cell.done{border-style:solid;border-color:#bfe6d3;background:#f4fbf8}
.cell .st,.scell .st{font-size:13px;font-weight:700;color:var(--muted)}
.cell .badge,.scell .badge{font-size:13px;padding:1px 8px}
.qtext{font-weight:650}
.qmeta{color:var(--muted);font-size:14px}
.copy-row{display:flex;align-items:flex-start;gap:6px}
.copy-row .qtext{flex:1;min-width:0;padding-top:10px}
/* article editor */
.art-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.art-side{position:sticky;top:16px}
@media (max-width:1100px){.art-layout{grid-template-columns:minmax(0,1fr)}.art-side{position:static}}
.step-num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-weight:800;font-size:14px;margin-right:8px;flex:none}
.sec{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface-2)}
.sec-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.sec-head b{flex:1}
.check-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;cursor:pointer;margin-bottom:8px;transition:all .15s;color:var(--text)}
.check-item:hover{border-color:var(--pri)}
.check-item.err{border-color:#f6c5cb;background:#fff8f9}
.check-item.warn{border-color:#fbd9ad;background:#fffbf5}
.preview-frame{width:100%;height:640px;border:1px solid var(--line);border-radius:14px;background:#fff;display:block;margin:0 auto;transition:width .3s}
.preview-frame.mobile{width:375px;max-width:100%}
.hl-box{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;max-height:420px;overflow:auto}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 12px 20px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:4px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--pri)}
.timeline li::after{content:"";position:absolute;left:7.5px;top:18px;bottom:0;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
/* cycle steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.step{display:block;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;color:inherit;transition:all .15s}
.step:hover{border-color:#c9c4f7;background:#fff;transform:translateY(-2px)}
.step .n{font-size:13px;font-weight:800;color:var(--pri)}
.step b{display:block;margin:2px 0}
.step.done{background:#f4fbf8;border-color:#bfe6d3}.step.done .n{color:var(--ok)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line-2)}
.list li:last-child{border-bottom:0}
.list li .grow{flex:1 1 200px;min-width:0}
.more-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.more-grid a{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:700}
.delta.up{color:var(--ok);font-weight:700}.delta.down{color:var(--err);font-weight:700}
.sticky-bar{position:sticky;top:8px;z-index:5}
@media (max-width:900px){.sticky-bar{top:62px}}
.report-doc h2{margin-top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="주 메뉴"></aside>
  <div class="main-wrap" style="min-width:0">
    <header class="topbar" id="topbar"></header>
    <main id="main" class="main"><div class="empty"><div class="big">⏳</div>불러오는 중…</div></main>

/* =========================================================

/* ---------- 공통 유틸 ---------- */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const KST = 'Asia/Seoul';
const fmtD = new Intl.DateTimeFormat('en-CA', { timeZone: KST, year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtDTf = new Intl.DateTimeFormat('ko-KR', { timeZone: KST, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
const today = () => fmtD.format(new Date());
const nowISO = () => new Date().toISOString();
const fmtDate = s => !s ? '' : (/^\d{4}-\d{2}-\d{2}$/.test(s) ? s : fmtD.format(new Date(s)));
const fmtDT = s => s ? fmtDTf.format(new Date(s)) : '';
const daysBetween = (a, b) => Math.round((Date.parse(fmtDate(b)) - Date.parse(fmtDate(a))) / 86400000);
const pct = (n, d) => d ? Math.round(n / d * 1000) / 10 : null;
const pctTxt = (n, d) => d ? `${pct(n, d)}%` : '—';
const norm = s => String(s || '').toLowerCase();
const compact = s => norm(s).replace(/\s+/g, '');
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const splitList = s => String(s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
const uniq = arr => [...new Set(arr)];
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const badge = (t, k = '') => `<span class="badge ${k}">${esc(t)}</span>`;
const pageHead = (t, subHtml = '', act = '') => `<div class="page-head"><div class="titles"><h1>${esc(t)}</h1>${subHtml ? `<p class="sub">${subHtml}</p>` : ''}</div>${act ? `<div class="actions">${act}</div>` : ''}</div>`;

const opts = (list, cur, blank) => (blank !== undefined ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => { const [v, l] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(cur ?? '') ? 'selected' : ''}>${esc(l)}</option>`; }).join('');
const notFound = what => `<div class="card empty"><div class="big">🔍</div><p>${esc(what)}을(를) 찾을 수 없습니다.</p><a class="btn" href="#home">홈으로</a></div>`;
const DISCLAIMER = `<div class="notice info"><div class="grow">ⓘ <b>표본 측정</b>이며, 같은 질문에도 AI 답변은 달라질 수 있습니다. 수치는 진행 상황 참고용입니다.</div></div>`;

function toast(msg, type = 'ok', ms = 2600) {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('#toast-root').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
}
function openModal(title, body, o = {}) {
  $('#modal-root').innerHTML = `<div class="modal-back" data-act="modalBack"><div class="modal ${o.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${esc(title)}</h2><button class="btn ghost icon" data-act="closeModal" aria-label="닫기">✕</button></div><div class="modal-body">${body}</div>${o.foot ? `<div class="modal-foot">${o.foot}</div>` : ''}</div></div>`;
  document.body.classList.add('noscroll');
  const f = $('#modal-root [autofocus]'); if (f) setTimeout(() => f.focus(), 30);
}
function closeModal() { $('#modal-root').innerHTML = ''; document.body.classList.remove('noscroll'); ui.ans = null; }
function ask(title, msg, { ok = '확인', danger = false } = {}) {
  return new Promise(res => {
    openModal(title, `<p style="white-space:pre-wrap">${esc(msg)}</p>`, { foot: `<button class="btn ghost" id="ask-no">취소</button><button class="btn ${danger ? 'danger' : 'primary'}" id="ask-yes">${esc(ok)}</button>` });
    $('#ask-no').onclick = () => { closeModal(); res(false); };
    $('#ask-yes').onclick = () => { closeModal(); res(true); };
  });
}
function field(f) {
  const id = 'f_' + f.id; const v = esc(f.value ?? '');
  let input;
  if (f.type === 'textarea') input = `<textarea id="${id}" rows="${f.rows || 4}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.autofocus ? 'autofocus' : ''}>${v}</textarea>`;
  else if (f.type === 'select') input = `<select id="${id}">${opts(f.options, f.value)}</select>`;
  else if (f.type === 'checkbox') input = `<label class="check"><input type="checkbox" id="${id}" ${f.value ? 'checked' : ''}> ${esc(f.text || '')}</label>`;
  else if (f.type === 'checks') input = `<div class="checks" id="${id}">${f.options.length ? f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<label class="check"><input type="checkbox" value="${esc(val)}" ${(f.value || []).includes(val) ? 'checked' : ''}> ${esc(lab)}</label>`; }).join('') : '<span class="muted">선택할 항목이 없습니다.</span>'}</div>`;
  else input = `<input id="${id}" type="${f.type || 'text'}" value="${v}" ${f.list ? `list="dl_${id}"` : ''} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.autofocus ? 'autofocus' : ''}>${f.list ? `<datalist id="dl_${id}">${f.list.map(x => `<option value="${esc(x)}">`).join('')}</datalist>` : ''}`;
  return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? ' <span class="req">*</span>' : ''}</label>${input}${f.hint ? `<small class="hint">${esc(f.hint)}</small>` : ''}</div>`;
}
function askForm(title, fields, okLabel = '저장', o = {}) {
  return new Promise(res => {
    openModal(title, `${o.intro || ''}<form id="ask-form">${fields.map(field).join('')}<p class="err-msg" id="ask-err"></p><button type="submit" hidden></button></form>`, { wide: o.wide, foot: `<button class="btn ghost" type="button" id="ask-no">취소</button><button class="btn primary" id="ask-yes">${esc(okLabel)}</button>` });
    const submit = () => {
      const out = {};
      for (const f of fields) {
        const el = $('#f_' + f.id);
        let v;
        if (f.type === 'checkbox') v = el.checked;
        else if (f.type === 'checks') v = $$('input:checked', el).map(x => x.value);
        else v = el.value.trim();
        if (f.required && (!v || (Array.isArray(v) && !v.length))) { $('#ask-err').textContent = `"${f.label}"을(를) 입력하세요.`; el.focus && el.focus(); return; }
        out[f.id] = v;
      }
      if (o.validate) { const msg = o.validate(out); if (msg) { $('#ask-err').textContent = msg; return; } }
      closeModal(); res(out);
    };
    $('#ask-yes').onclick = submit;
    $('#ask-form').onsubmit = e => { e.preventDefault(); submit(); };
    $('#ask-no').onclick = () => { closeModal(); res(null); };
  });
}
async function copyText(t, msg = '복사했습니다') {
  try { await navigator.clipboard.writeText(t); toast(msg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false;
    try { ok = document.execCommand('copy'); } catch (_) { }
    ta.remove(); toast(ok ? msg : '복사하지 못했습니다. 직접 선택해 복사하세요.', ok ? 'ok' : 'err');
  }
}
function download(name, text, mime = 'text/plain') {
  const b = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
const safeFile = s => String(s || 'file').replace(/[\\/:*?"<>|\s]+/g, '-').replace(/-+/g, '-').slice(0, 80);

/* ---------- 아이콘 ---------- */
const IC = {

const icon = (n, s = 20) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n] || ''}</svg>`;

/* ---------- 저장 계층 (IndexedDB) ---------- */
const DB_NAME = 'geo-console', DB_VER = 1;
const COLL = ['brands', 'stores', 'queries', 'rounds', 'answers', 'articles', 'sourceChecks'];
const ALL_STORES = ['settings', ...COLL];
const S = { settings: null, brands: [], stores: [], queries: [], rounds: [], answers: [], articles: [], sourceChecks: [] };
let idb;
function openDB() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('이 브라우저는 IndexedDB를 지원하지 않습니다.'));
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => { const d = r.result; ALL_STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(stores, mode, fn) {
  return new Promise((res, rej) => {
    let t; try { t = idb.transaction(stores, mode); } catch (e) { rej(e); return; }
    let out; try { out = fn(t); } catch (e) { try { t.abort(); } catch (_) { } rej(e); return; }
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('transaction aborted'));
  });
}
function getAll(s) { return new Promise((res, rej) => { const r = idb.transaction(s).objectStore(s).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function saveFail(e) { console.error(e); toast(`저장에 실패했습니다. 화면의 입력 내용은 그대로 두었습니다. 백업을 받아 두세요. (${(e && e.name) || '오류'})`, 'err', 7000); }
async function put(store, obj) {
  if (store === 'settings') S.settings = obj;
  else { const arr = S[store]; const i = arr.findIndex(x => x.id === obj.id); if (i >= 0) arr[i] = obj; else arr.push(obj); }
  try { await tx([store], 'readwrite', t => t.objectStore(store).put(obj)); return true; } catch (e) { saveFail(e); return false; }
}
async function putMany(store, objs) {
  objs.forEach(o => { const arr = S[store]; const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); });
  try { await tx([store], 'readwrite', t => { const os = t.objectStore(store); objs.forEach(o => os.put(o)); }); return true; } catch (e) { saveFail(e); return false; }
}
async function del(store, id) {
  S[store] = S[store].filter(x => x.id !== id);
  try { await tx([store], 'readwrite', t => t.objectStore(store).delete(id)); return true; } catch (e) { saveFail(e); return false; }
}
async function delMany(store, ids) {
  const set = new Set(ids); S[store] = S[store].filter(x => !set.has(x.id));
  try { await tx([store], 'readwrite', t => { const os = t.objectStore(store); ids.forEach(id => os.delete(id)); }); return true; } catch (e) { saveFail(e); return false; }
}
const saveSettings = () => put('settings', S.settings);

/* ---------- 조회 도우미 ---------- */
const byId = (c, id) => S[c].find(x => x.id === id);
const storeName = id => byId('stores', id)?.name || '(삭제된 매장)';

/* ---------- 화면 상태 ---------- */

  gen: { regions: new Set(), categories: new Set(), themes: new Set() }, genPreview: [],
  qf: { region: '', theme: '', status: '', work: '', text: '' }, qsel: new Set(),
  roundFilter: 'all', dashRound: '', repA: '', repB: '', artFilter: '', hl: null, preview: 'mobile', ans: null, lastChecker: '',
};

/* ---------- 라우터 ---------- */
const NAV = [['home', '홈', 'home'], ['queries', '질의', 'list'], ['rounds', '측정', 'pulse'], ['dashboard', '현황', 'chart'], ['articles', '글', 'doc'], ['sources', '출처', 'link'], ['report', '리포트', 'report'], ['stores', '매장', 'store'], ['settings', '설정', 'gear']];
const PARENT = { round: 'rounds', article: 'articles', store: 'stores' };
const ROUTES = { home: vHome, queries: vQueries, rounds: vRounds, round: vRound, dashboard: vDash, articles: vArticles, article: vArticle, sources: vSources, report: vReport, stores: vStores, store: vStore, settings: vSettings };
function route() { const h = location.hash.slice(1) || 'home'; const [name, ...rest] = h.split('/'); return { name: ROUTES[name] ? name : 'home', arg: decodeURIComponent(rest.join('/')) }; }
let lastRouteKey = '';
const afterRender = [];
function render() {
  const r = route(); const key = location.hash; const y = window.scrollY;
  let html;
  try { html = ROUTES[r.name](r.arg); } catch (e) { console.error(e); html = `<div class="notice err">화면을 그리는 중 오류가 발생했습니다: ${esc(e.message)}</div>`; }
  $('#main').innerHTML = html;
  renderNav(r.name);
  if (key === lastRouteKey) window.scrollTo(0, y); else window.scrollTo(0, 0);
  lastRouteKey = key;
  const fns = afterRender.splice(0); fns.forEach(f => { try { f(); } catch (e) { console.error(e); } });
}
const go = h => { if (location.hash === '#' + h) render(); else location.hash = h; };

function runningChip() {

}
function renderNav(curName) {

  <nav class="side-nav">${NAV.map(([k, l, i]) => `<a href="#${k}" class="${k === parent ? 'on' : ''}" ${k === parent ? 'aria-current="page"' : ''}>${icon(i)}<span>${l}</span>${nb(k)}</a>`).join('')}</nav>
  <div class="side-foot">${runningChip()}<p class="small muted" style="margin:8px 0 0">브라우저에 저장됩니다. 정기적으로 백업하세요.</p></div>`;
  const main = ['home', 'rounds', 'dashboard', 'articles'];

/* ---------- 이벤트 위임 ---------- */
const A = {}, CH = {}, IN = {};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el) return; const f = A[el.dataset.act]; if (f) f(el, e); });

/* ---------- 태그 편집기 (별칭·목록) ---------- */
const TAGS = {};
function tagEditor(key, list, placeholder = '입력 후 Enter') {
  return `<div class="tags">${list.length ? list.map((t, i) => `<span class="tag">${esc(t)}<button data-act="tagDel" data-key="${key}" data-i="${i}" aria-label="${esc(t)} 삭제">✕</button></span>`).join('') : '<span class="muted small">아직 없습니다.</span>'}</div>
  <div class="frow"><div class="field" style="margin-bottom:0"><input type="text" id="tag-${key}" data-tag-input="${key}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}"></div><button class="btn soft" data-act="tagAdd" data-key="${key}" style="margin-bottom:0">추가</button></div>`;
}
function tagAdd(key) {
  const inp = $('#tag-' + key); if (!inp) return;
  const vals = splitList(inp.value); if (!vals.length) return;
  const t = TAGS[key]; const list = t.get();
  const add = vals.filter(v => !list.some(x => compact(x) === compact(v)));
  if (!add.length) { toast('이미 있는 항목입니다', 'warn'); return; }
  t.set([...list, ...add]); render();
  setTimeout(() => { const n = $('#tag-' + key); if (n) n.focus(); }, 0);
}
A.tagAdd = el => tagAdd(el.dataset.key);
A.tagDel = el => { const t = TAGS[el.dataset.key]; const list = [...t.get()]; list.splice(+el.dataset.i, 1); t.set(list); render(); };

/* =========================================================

  const changed = []; let added = 0, updated = 0;
  for (const p of DIRECT_STORES) {
    const keys = [p.name, ...(p.match || [])].map(compact);
    let st = S.stores.find(s => keys.includes(compact(s.name)));
    if (!st) { st = newStore({ name: p.name, status: '미입력' }); added++; } else updated++;
    Object.assign(st, { name: p.name, brandId: brandId[p.brand] || st.brandId, region: p.region || st.region, category: p.category || st.category });
    const shared = DIRECT_BRANDS.filter(n => DIRECT_STORES.filter(x => x.brand === n).length > 1).map(compact);
    const merged = [...st.aliases.filter(a => !shared.includes(compact(a))), p.name, ...p.aliases];
    st.aliases = merged.filter((a, i) => merged.findIndex(x => compact(x) === compact(a)) === i);
    for (const k of ['address', 'parking', 'groupSeats']) {
      const f = st.info[k];
      if (p[k] && f.status !== '확인됨') Object.assign(f, { value: p[k], status: '확인 필요', note: DIRECT_SRC });
    }
    st.memo = p.memo || (st.seed ? '' : st.memo);
    delete st.seed;
    changed.push(st);
  }
  await putMany('stores', changed);
  ['보라매', '문래', '상암', '마포', '강남'].forEach(r => addToList('regions', r));
  ['고깃집', '곱창', '갈비'].forEach(c => addToList('categories', c));
  S.settings.directStoresApplied = DIRECT_STORES.length; await saveSettings();

function roundProgress(r) { const set = new Set(r.ais); const got = S.answers.filter(a => a.roundId === r.id && set.has(a.ai)).length; return [got, r.queries.length * r.ais.length]; }

function vRound(id) {

      <p class="hint" style="margin:8px 0 0">같은 질문에도 답이 달라지므로 조건을 남겨 둡니다.</p></div>
  </div>

    <p class="hint" style="margin-top:-4px">복사 버튼으로 질의를 복사해 각 AI에 묻고, 칸을 눌러 답변을 붙여넣으세요. 휴대폰 AI 앱에서 복사해 바로 넣어도 됩니다.</p>
    ${rows ? `<div class="table-wrap"><table class="t stack"><thead><tr><th>질의</th>${r.ais.map(ai => `<th>${esc(ai)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">조건에 맞는 칸이 없습니다.</div>'}

/* ---------- 답변 붙여넣기 창 ---------- */
function nextEmpty(r, qid, ai) {
  const cells = []; r.queries.forEach(q => r.ais.forEach(x => cells.push({ qid: q.id, ai: x })));
  const start = qid ? cells.findIndex(c => c.qid === qid && c.ai === ai) : -1;
  for (let k = 1; k <= cells.length; k++) { const c = cells[(start + k + cells.length) % cells.length]; if (!getAns(r.id, c.qid, c.ai)) return c; }
  return null;
}
A.ansNext = el => { const r = byId('rounds', el.dataset.id); const n = nextEmpty(r, null, null); if (n) openAnswer(r.id, n.qid, n.ai); else toast('모든 칸을 수집했습니다'); };
A.ansOpen = el => openAnswer(el.dataset.r, el.dataset.q, el.dataset.ai);
function openAnswer(rid, qid, ai) {

    ${a?.archived && !a.raw ? `<div class="notice info"><div class="grow">이 답변의 원문은 백업 파일로 옮겨졌습니다. 판정 결과만 남아 있습니다.</div></div>` : ''}
    <div class="field"><label for="ans_raw">${esc(ai)} 답변 원문</label><textarea id="ans_raw" rows="9" autofocus placeholder="AI 답변 전체를 붙여넣으세요. 링크가 있으면 함께 붙여넣어야 출처를 찾을 수 있습니다.">${esc(a?.raw || '')}</textarea><small class="hint">Ctrl+Enter: 저장하고 다음 미수집 칸으로. 붙여넣은 내용은 글자로만 보이며 실행되지 않습니다.</small></div>

  const foot = `${a ? `<button class="btn ghost danger" data-act="ansDel">비우기</button><button class="btn ghost" data-act="ansRejudge" ${a.raw ? '' : 'disabled'}>자동 판정 다시</button>` : ''}<span class="spacer"></span><button class="btn" data-act="ansSave">저장</button><button class="btn primary" data-act="ansSaveNext">저장하고 다음</button>`;
  openModal(`${r.name} · 답변`, body, { wide: true, foot });
  ui.ans = { rid, qid, ai, dirtyJ: false };
}

async function saveAnswer(next) {

/* =========================================================
   F-04 노출 판정·출처 추출 (같은 입력 → 항상 같은 결과)
   ========================================================= */
const URL_RE = /\bhttps?:\/\/[^\s<>"'()\[\]{}]+/gi;
const BARE_RE = /\b(?:[a-z0-9-]+\.)+(?:com|net|org|kr|me|to|be|page|gl|io|ly)\b(?:\/[^\s<>"'()\[\]{}]*)?/gi;
function hostOf(u) { try { return new URL(/^https?:/i.test(u) ? u : 'http://' + u).hostname.toLowerCase().replace(/^www\./, '').replace(/\.+$/, ''); } catch (_) { return ''; } }
const officialName = () => S.settings.sourceDict.find(d => /공식/.test(d.name))?.name || '공식 홈페이지';
function siteHosts() { return uniq([S.settings.siteUrl, ...S.stores.map(s => s.pageUrl)].map(safeUrl).filter(Boolean).map(hostOf).filter(Boolean)); }
function hostToSource(host, sh) {
  if (sh.some(h => host === h || host.endsWith('.' + h))) return officialName();
  let best = null, bl = 0;
  for (const d of S.settings.sourceDict) for (const dom of d.domains) {
    const x = dom.toLowerCase().replace(/^www\./, '');
    if (x && (host === x || host.endsWith('.' + x)) && x.length > bl) { best = d.name; bl = x.length; }
  }
  return best;
}
function listOrder(text, aliasesC) {
  const lines = text.split(/\r?\n/);
  const pats = [/^\s{0,3}(?:\*\*)?\d{1,2}\s*[.)]\s*/, /^\s{0,3}#{1,6}\s+/, /^[-*•·]\s+/];
  for (const p of pats) {
    const items = lines.filter(l => p.test(l));
    if (items.length < 2) continue;
    const i = items.findIndex(l => { const c = compact(l); return aliasesC.some(a => c.includes(a)); });
    if (i >= 0) return i + 1;
  }
  return null;
}
function judge(raw, q) {
  const text = String(raw || ''); const ctext = compact(text);
  const hits = [];
  for (const st of S.stores) {
    let pos = -1;
    for (const al of st.aliases) { const c = compact(al); if (c.length < 2) continue; const i = ctext.indexOf(c); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
    if (pos >= 0) hits.push({ id: st.id, pos });
  }
  hits.sort((a, b) => a.pos - b.pos || a.id.localeCompare(b.id));
  const stores = hits.map(h => h.id);
  const ourAliases = S.stores.filter(s => stores.includes(s.id)).flatMap(s => s.aliases).map(compact).filter(c => c.length >= 2);
  const order = stores.length ? listOrder(text, ourAliases) : null;
  const hosts = new Set();
  for (const m of text.matchAll(URL_RE)) { const h = hostOf(m[0]); if (h) hosts.add(h); }
  for (const m of text.matchAll(BARE_RE)) { if (text[m.index - 1] === '@') continue; const h = hostOf(m[0]); if (h) hosts.add(h); }
  const sh = siteHosts(); const found = new Set();
  hosts.forEach(h => found.add(hostToSource(h, sh) || h));
  for (const d of S.settings.sourceDict) if (d.aliases.some(a => compact(a).length >= 2 && ctext.includes(compact(a)))) found.add(d.name);
  const dictOrder = S.settings.sourceDict.map(d => d.name);
  const sources = [...found].sort((a, b) => { const ia = dictOrder.indexOf(a), ib = dictOrder.indexOf(b); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b); });
  const targets = q?.targets || [];
  return { exposed: stores.length > 0, stores, order, targetHit: targets.length ? targets.some(t => stores.includes(t)) : null, sources };
}

function roundStats(r) {

  const st = { n: 0, e: 0, tn: 0, te: 0, byAI: {}, byRegion: {}, byTheme: {}, src: {} };
  r.ais.forEach(ai => st.byAI[ai] = { n: 0, e: 0 });
  const byQ = new Map();
  for (const a of ans) {
    const q = qmap.get(a.queryId); if (!q) continue;
    if (!byQ.has(q.id)) byQ.set(q.id, []); byQ.get(q.id).push(a);
    st.n++; if (a.exposed) st.e++;
    if (q.targets?.length) { st.tn++; if (a.targetHit) st.te++; }
    for (const [k, key] of [['byAI', a.ai], ['byRegion', q.region || '미분류'], ['byTheme', q.theme || '미분류']]) { const g = st[k][key] || (st[k][key] = { n: 0, e: 0 }); g.n++; if (a.exposed) g.e++; }
    for (const s of a.sources || []) { const g = st.src[s] || (st.src[s] = { n: 0, us: 0 }); g.n++; if (a.exposed) g.us++; }

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const termRe = term => { const c = compact(term); return c ? new RegExp([...c].map(escRe).join('\\s*'), 'gi') : null; };
function highlight(text, terms) {
  const t = String(text || ''); const rs = [];
  for (const term of terms || []) { const re = termRe(term); if (!re) continue; for (const m of t.matchAll(re)) if (m[0]) rs.push([m.index, m.index + m[0].length]); }
  rs.sort((a, b) => a[0] - b[0]); let out = '', p = 0;
  for (const [s, e] of rs) { if (s < p) continue; out += esc(t.slice(p, s)) + '<mark>' + esc(t.slice(s, e)) + '</mark>'; p = e; }
  return out + esc(t.slice(p));
}
const artBody = a => a.sections.map(s => `${s.heading}\n${s.body}`).join('\n\n');
const artAll = a => [a.title, a.summary, artBody(a), a.faq.map(f => `${f.q}\n${f.a}`).join('\n'), a.meta].join('\n');
const PRICE_RE = /(\d{1,3}(?:,\d{3})+|\d+)\s*원/g;
const MAN_RE = /(\d+(?:\.\d+)?)\s*만\s*(?:(\d)\s*천\s*)?원/g;
const TIME_RE = /\d{1,2}\s*:\s*\d{2}|(?:오전|오후|새벽|밤|저녁)?\s*\d{1,2}\s*시(?!간|즌|리즈|식|청|장|대)(?:\s*\d{1,2}\s*분|\s*반)?/g;
function pricesIn(t) {
  const out = [];
  for (const m of t.matchAll(MAN_RE)) out.push({ text: m[0], v: Math.round(Number(m[1]) * 10000 + (m[2] ? Number(m[2]) * 1000 : 0)) });
  for (const m of t.matchAll(PRICE_RE)) if (!out.some(o => o.text.endsWith(m[0]))) out.push({ text: m[0], v: Number(m[1].replace(/,/g, '')) });
  return out;
}
const sentencesOf = t => String(t || '').split(/[.!?。\n]+/).map(compact).filter(s => s.length >= 12);
const gramCache = new Map();
function grams(a) {
  const key = a.id + '|' + a.updatedAt; const c = gramCache.get(a.id);
  if (c && c.key === key) return c;
  const body = compact(artBody(a)); const g = new Set(); for (let i = 0; i + 3 <= body.length; i++) g.add(body.slice(i, i + 3));
  const v = { key, g, sent: new Set(sentencesOf(artBody(a))) }; gramCache.set(a.id, v); return v;
}
function articleChecks(a) {
  const out = []; const err = (msg, terms = []) => out.push({ level: 'err', msg, terms }); const warn = (msg, terms = []) => out.push({ level: 'warn', msg, terms });
  if (!a.queryIds.length) err('연결된 질의가 없습니다');
  if (!a.title.trim()) err('제목이 비어 있습니다');
  if (!a.sections.some(s => s.body.trim())) err('본문이 비어 있습니다');
  if (!a.meta.trim()) err('메타 설명이 비어 있습니다');
  const stores = linkedStores(a); const all = artAll(a); const call = compact(all);
  if (!stores.length) warn('연결 매장이 없어 공식 정보 블록이 들어가지 않습니다');
  // 같은 브랜드 다른 지점
  const brandIds = new Set(stores.map(s => s.brandId).filter(Boolean));
  const brandC = [...brandIds].map(id => compact(brandName(id)));
  const linkedC = stores.flatMap(s => [s.name, ...s.aliases]).map(compact);
  S.stores.filter(s => brandIds.has(s.brandId) && !a.storeIds.includes(s.id)).forEach(o => {
    const hits = uniq([o.name, ...o.aliases]).filter(al => { const c = compact(al); return c.length >= 2 && !brandC.includes(c) && !linkedC.some(l => l.includes(c)) && call.includes(c); });
    if (hits.length) err(`연결 매장이 아닌 같은 브랜드 지점 "${o.name}"이(가) 나옵니다`, hits);
  });
  // 금액
  const valid = new Set(stores.filter(s => s.menu.status === '확인됨').flatMap(s => s.menu.items.map(i => i.price)).filter(p => p != null));
  const prices = pricesIn(all);
  const bad = prices.filter(p => !valid.has(p.v)), ok = prices.filter(p => valid.has(p.v));
  if (bad.length) err(`확인된 메뉴 가격에 없는 금액: ${uniq(bad.map(p => p.text)).join(', ')}`, bad.map(p => p.text));
  if (ok.length) warn(`본문에 금액을 직접 썼습니다 (정보 블록에 자동으로 들어갑니다): ${uniq(ok.map(p => p.text)).join(', ')}`, ok.map(p => p.text));
  const times = uniq([...all.matchAll(TIME_RE)].map(m => m[0].trim()).filter(Boolean));
  if (times.length) warn(`본문에 시간 숫자를 직접 썼습니다: ${times.join(', ')}`, times);
  const claims = S.settings.claimWords.filter(w => w && call.includes(compact(w)));
  if (claims.length) warn(`근거가 필요한 표현: ${claims.join(', ')}`, claims);
  // 확인 필요 정보
  stores.forEach(s => {
    INFO_FIELDS.forEach(([k, l]) => { const f = s.info[k]; if (f.status === '확인 필요' && f.value && compact(f.value).length >= 3 && call.includes(compact(f.value))) warn(`"확인 필요" 정보를 참조합니다: ${s.name} ${l}`, [f.value]); });
    if (s.menu.status !== '확인됨') { const n = s.menu.items.map(i => i.name).filter(x => x && compact(x).length >= 2 && call.includes(compact(x))); if (n.length) warn(`확인되지 않은 메뉴를 언급합니다 (${s.name}): ${n.join(', ')}`, n); }
  });
  if (a.needCheck.length) warn(`작성 AI가 남긴 확인 필요 항목 ${a.needCheck.length}개를 해결하세요`);
  // 유사 글
  const me = grams(a);
  for (const o of S.articles) {
    if (o.id === a.id) continue;
    if (a.title.trim() && compact(o.title) === compact(a.title)) { warn(`기존 글과 제목이 같습니다: "${o.title}"`, [a.title]); continue; }
    const g = grams(o);
    let same = 0; me.sent.forEach(x => { if (g.sent.has(x)) same++; });
    const sr = me.sent.size >= 3 ? same / me.sent.size : 0;
    let inter = 0; if (me.g.size && g.g.size) me.g.forEach(x => { if (g.g.has(x)) inter++; });
    const jac = me.g.size > 60 && g.g.size > 60 ? inter / (me.g.size + g.g.size - inter) : 0;
    if (sr >= 0.3 || jac >= 0.5) warn(`기존 글 "${o.title || '(제목 없음)'}"과 지나치게 비슷합니다 (문장 겹침 ${Math.round(sr * 100)}%, 글자 유사도 ${Math.round(jac * 100)}%)`, [...me.sent].filter(x => g.sent.has(x)).slice(0, 20));
  }
  return out;
}

A.restore = () => { const f = $('#restore-file'); f.value = ''; f.click(); };
function validBackup(o) {
  if (!o || o.app !== 'geo-console' || !o.data || typeof o.data !== 'object') return '이 앱의 백업 파일이 아닙니다.';
  const d = o.data;
  if (!d.settings || typeof d.settings !== 'object' || !Array.isArray(d.settings.ais)) return '설정 정보가 없습니다.';
  for (const c of COLL) { if (!Array.isArray(d[c])) return `"${c}" 데이터가 없습니다.`; if (d[c].some(x => !x || typeof x.id !== 'string')) return `"${c}" 데이터 형식이 올바르지 않습니다.`; }
  if ((o.dataVersion || 1) > DATA_VERSION) return '더 새로운 버전의 앱에서 만든 백업입니다.';
  return '';
}
async function onRestoreFile(e) {
  const file = e.target.files[0]; if (!file) return;
  let o; try { o = JSON.parse(await file.text()); } catch (_) { toast('백업 파일을 읽을 수 없습니다. 기존 데이터를 그대로 두었습니다.', 'err', 5000); return; }
  const bad = validBackup(o); if (bad) { toast(`불러오지 않았습니다: ${bad} 기존 데이터를 그대로 두었습니다.`, 'err', 6000); return; }
  const d = o.data;
  if (!await ask('백업 불러오기', `지금 데이터를 모두 지우고 백업(${fmtDT(o.exportedAt) || '날짜 미상'})으로 바꿉니다.\n매장 ${d.stores.length} · 질의 ${d.queries.length} · 회차 ${d.rounds.length} · 답변 ${d.answers.length} · 글 ${d.articles.length}\n계속할까요?`, { ok: '덮어쓰기', danger: true })) return;
  const settings = { ...d.settings, id: 'main' };
  try {
    await tx(ALL_STORES, 'readwrite', t => { ALL_STORES.forEach(s => t.objectStore(s).clear()); t.objectStore('settings').put(settings); COLL.forEach(c => { const os = t.objectStore(c); d[c].forEach(x => os.put(x)); }); });
  } catch (err) { console.error(err); toast('불러오기에 실패했습니다. 기존 데이터를 그대로 두었습니다.', 'err', 6000); return; }
  S.settings = settings; COLL.forEach(c => S[c] = d[c]); migrateSettings();
  cur.store = cur.article = null; ui.qsel.clear(); ui.dashRound = ui.repA = ui.repB = '';
  toast('백업을 불러왔습니다'); go('home');
}
A.wipe = async () => {
  if (!await ask('전체 삭제', '이 브라우저에 저장된 모든 데이터(매장·질의·측정·글·출처·설정)를 삭제합니다. 되돌릴 수 없습니다.\n먼저 백업을 받았는지 확인하세요.', { ok: '모두 삭제', danger: true })) return;
  const settings = defaultSettings();
  try { await tx(ALL_STORES, 'readwrite', t => { ALL_STORES.forEach(s => t.objectStore(s).clear()); t.objectStore('settings').put(settings); }); }
  catch (err) { saveFail(err); return; }
  S.settings = settings; COLL.forEach(c => S[c] = []); cur.store = cur.article = null; ui.qsel.clear(); ui.dashRound = ui.repA = ui.repB = '';
  toast('모든 데이터를 삭제했습니다'); go('home');
};

/* =========================================================
   홈 (이번 달 할 일)
   ========================================================= */
function vHome() {
  const r = latestRound(); const [got, tot] = r ? roundProgress(r) : [0, 0]; const st = r ? roundStats(r) : null;
  const empty = st ? st.queries.filter(x => x.kind === 'empty') : [];
  const review = S.articles.filter(a => a.status === 'review'); const todos = sourceTodos(); const running = runningQueries().length;
  const age = backupAge();
  const backupNote = hasData() && (age == null || age > 7) ? `<div class="notice warn"><div class="grow"><b>백업 안내</b> — ${age == null ? '아직 백업한 적이 없습니다.' : `마지막 백업 후 ${age}일이 지났습니다.`} 브라우저 기록을 지우면 데이터가 사라집니다.</div><button class="btn" data-act="backup">지금 백업</button></div>` : '';
  const setupNote = !S.settings.ownerName ? `<div class="notice info"><div class="grow">설정에서 <b>운영 주체명</b>과 <b>공식 홈페이지 주소</b>를 입력하면 글·llms.txt·sitemap에 반영됩니다.</div><a class="btn" href="#settings">설정으로</a></div>` : '';
  const allDone = st && st.n > 0 && S.answers.filter(a => a.roundId === r.id).every(a => a.done);
  const steps = [
    ['1', '질의 설계', `운영 중 ${running}개`, 'queries', running > 0],
    ['2', '측정', r ? `${got} / ${tot} 수집` : '회차 없음', r ? 'round/' + r.id : 'rounds', r && tot && got === tot],
    ['3', '분석', st ? `노출률 ${pctTxt(st.e, st.n)}` : '측정 후', 'dashboard', allDone],
    ['4', '작업', `검수 대기 ${review.length} · 출처 할 일 ${todos.length}`, 'articles', false],
    ['5', '리포트', S.rounds.length > 1 ? '회차 비교 가능' : '회차 2개부터', 'report', false],
  ];
  return `${pageHead('이번 달 할 일', `${esc(today())} · 측정 → 분석 → 글·출처 작업 → 리포트`)}
  ${backupNote}${setupNote}
  <div class="card hero"><div class="card-head"><h2 style="color:#fff">${r ? esc(r.name) : '첫 측정을 시작하세요'}</h2></div>
    ${r ? `<p class="sub" style="margin:-6px 0 12px">${esc(r.date)} · 질의 ${r.queries.length}개 × AI ${r.ais.length}곳</p>${meter(got, tot)}` : `<p class="sub" style="margin:-6px 0 12px">질의 세트에서 측정할 질의를 "운영 중"으로 두고, 첫 회차(기준점)를 만드세요.</p>`}
    <div class="actions" style="margin-top:14px">${r && got < tot ? `<a class="btn white" href="#round/${r.id}">측정 이어하기</a>` : ''}<button class="btn ${r && got < tot ? '' : 'white'}" data-act="roundAdd">+ 새 회차</button></div></div>
  <div class="kpis">
    <a class="kpi" href="${r ? '#round/' + r.id : '#rounds'}"><div class="label">측정 진행률</div><div class="val">${tot ? pctTxt(got, tot) : '—'}</div><div class="small muted">${got} / ${tot}칸</div></a>
    <a class="kpi" href="#dashboard"><div class="label">빈 질의</div><div class="val">${empty.length}<small>개</small></div><div class="small muted">모든 AI에서 우리 매장 없음</div></a>
    <a class="kpi" href="#articles"><div class="label">검수 대기 글</div><div class="val">${review.length}<small>건</small></div><div class="small muted">승인 ${pubArticles().length}건</div></a>
    <a class="kpi" href="#sources"><div class="label">외부 출처 할 일</div><div class="val">${todos.length}<small>개</small></div><div class="small muted">미등록·불일치·답글</div></a>
  </div>
  <div class="card"><h2>월간 사이클</h2><div class="steps">${steps.map(([n, t, d, h, done]) => `<a class="step ${done ? 'done' : ''}" href="#${h}"><span class="n">${done ? '✓ ' : ''}STEP ${n}</span><b>${t}</b><span class="small muted">${d}</span></a>`).join('')}</div>
    <p class="hint" style="margin:10px 0 0">새 글이 AI 답변에 반영되기까지 약 2개월이 걸린다는 설명이 있어, 리포트에서 글 게시일과 측정일 간격을 함께 봅니다.</p></div>
  <div class="grid2">
    <div class="card"><h2>빈 질의</h2>${empty.length ? `<ul class="list">${empty.slice(0, 6).map(x => `<li><span class="grow">${esc(x.q.text)}</span>${articlesForQuery(x.q.id).length ? `<a class="btn ghost" href="#article/${articlesForQuery(x.q.id)[0].id}">글 보기</a>` : `<button class="btn soft" data-act="artFromQuery" data-q="${x.q.id}" data-r="${r.id}">글 만들기</button>`}</li>`).join('')}</ul>${empty.length > 6 ? `<a href="#dashboard" class="small">전체 ${empty.length}개 보기 →</a>` : ''}` : `<p class="muted" style="margin:0">${st ? '빈 질의가 없습니다.' : '측정 후 표시됩니다.'}</p>`}</div>
    <div class="card"><h2>검수 대기 글</h2>${review.length ? `<ul class="list">${review.map(a => `<li><a class="grow qtext" href="#article/${a.id}">${esc(a.title || '(제목 없음)')}</a>${badge('검수 요청', 'warn')}</li>`).join('')}</ul>` : '<p class="muted" style="margin:0">없습니다.</p>'}</div>
  </div>`;
}

/* =========================================================
   시작
   ========================================================= */
async function init() {
  try { idb = await openDB(); }
  catch (e) { $('#main').innerHTML = `<div class="notice err"><div class="grow"><b>저장소를 열 수 없습니다.</b> ${esc(e.message || e)}<br>시크릿 창이거나 브라우저가 저장을 막고 있을 수 있습니다. 일반 창의 최신 Chrome·Edge·Safari에서 열어 주세요.</div></div>`; return; }
  try {
    for (const c of COLL) S[c] = await getAll(c);
    S.settings = (await getAll('settings')).find(x => x.id === 'main') || null;
  } catch (e) { $('#main').innerHTML = `<div class="notice err"><div class="grow">데이터를 읽지 못했습니다: ${esc(e.message || e)}</div></div>`; return; }
  if (!S.settings) { S.settings = defaultSettings(); await saveSettings(); }
  else migrateSettings();
  if (!S.settings.directStoresApplied) await applyDirectStores(true);
  try { navigator.storage?.persist?.(); } catch (_) { }
  $('#restore-file').addEventListener('change', onRestoreFile);
  render();
}
init();

</script>
</body>
</html>
